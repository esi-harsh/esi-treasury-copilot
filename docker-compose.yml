services:
  server:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-google/gemini-2.0-flash-001}
    volumes:
      - ./server/treasury.db:/app/treasury.db

  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - server
